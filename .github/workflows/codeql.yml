# Central reusable CodeQL workflow for all org.osgi.* spec repos, called
# from each repo's codeql.yml stub (otterdog blueprint codeql-analysis).
# build-mode none needs no working Maven build. The action versions live
# only here, pinned by commit SHA and kept current by Dependabot on this
# repo (one grouped PR, so init and analyze never drift apart).
name: codeql

on:
  workflow_call:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: java
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:java"
