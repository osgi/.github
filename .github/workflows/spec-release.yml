# Central reusable release workflow for all org.osgi.* spec repos and the
# parent pom, called from each repo's release.yml stub when a tag is pushed.
# The tag must equal the version (-Drevision in .mvn/maven.config, or the
# literal <version> of the parent pom) and must not be a SNAPSHOT.
# A tag x.y.z-RC[n] on the version x.y.z-SNAPSHOT releases a candidate: only
# the api module, with the tag as version (no tck, no spec).
# Artifacts are built with tests, signed and staged to Maven Central; the
# final publish stays manual in the Central portal (autoPublish: false).
name: spec-release

on:
  workflow_call:
    inputs:
      jdk:
        description: JDK used to build and deploy the release
        type: string
        default: '21'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.jdk }}
          cache: maven
          # server id used by the parent pom (central-publishing-maven-plugin)
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_PASSWORD
          # Maven 3.10 offers the credentials of a server only to the origins
          # bound to its id, and the id central is bound to
          # repo.maven.apache.org: the token has to reach central.sonatype.com
          mvn-server-repository-origins: |
            central:https://central.sonatype.com
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Guard - tag must equal the version
        id: guard
        run: |
          rev=$(sed -n 's/^-Drevision=//p' .mvn/maven.config)
          [ -n "$rev" ] || rev=$(mvn -B -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          tag='${{ github.ref_name }}'
          if echo "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-RC[0-9]*$'; then
            [ "$rev" = "${tag%-RC*}-SNAPSHOT" ] \
              || { echo "::error::RC tag '$tag' needs version '${tag%-RC*}-SNAPSHOT', not '$rev'"; exit 1; }
            [ -f api/pom.xml ] \
              || { echo "::error::RC tag '$tag' needs an api module"; exit 1; }
            echo "rc=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$rev" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::version '$rev' is not a plain x.y.z release version"; exit 1; }
          [ "$tag" = "$rev" ] \
            || { echo "::error::tag '$tag' does not match version '$rev'"; exit 1; }

      - name: Build, test and deploy release
        run: |
          if [ -n "$RC" ]; then
            mvn -B -ntp -U -Pdeploy -Drevision="$RC" -pl api deploy
          else
            mvn -B -ntp -U -Pdeploy deploy
          fi
        env:
          RC: ${{ steps.guard.outputs.rc }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
